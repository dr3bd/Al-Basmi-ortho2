name: Validate clinical persistence changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Storage and forensic suites
        run: bunx tsx src/storage/tests/executeTestsNode.ts
